const plain=h=>new DOMParser().parseFromString(h||'','text/html').body.textContent.trim();
function mkItem(src,rawT,dh,pd,link){let t=plain(rawT),s=src;if(!t||/^\[?no title\]?/i.test(t)||/^post from\b/i.test(t))t=plain(dh)||t;const k=t.lastIndexOf(' - ');if(k>8&&src==='Google 新聞'){s=t.slice(k+3);t=t.slice(0,k)}let b='';
 if(src==='Google 新聞'){const dd=new DOMParser().parseFromString(dh||'','text/html');const ls=[...dd.querySelectorAll('li')].map(l=>(l.querySelector('a')||l).textContent.trim()).filter(x=>x&&!x.startsWith(t.slice(0,12)));if(ls.length)b='相關報導：'+ls.slice(0,3).join('；')}
 else{const pl=plain(dh);if(pl.length>t.length+5)b=pl.slice(0,280)}
 const dt=pd?new Date(pd):null;
 return{t:t.slice(0,140),b:b,s:s,d:dt&&!isNaN(dt)?dt.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'',u:/^https?:\/\//i.test(link||'')?link:''}}
function parseItems(x,src,n){return [...x.querySelectorAll('item')].slice(0,n||6).map(e=>{const q=n=>{const el=e.querySelector(n);return el?el.textContent:''};return mkItem(src,q('title'),q('description'),q('pubDate'),q('link'))}).filter(i=>i.t)}
// rss2json 的 pubDate 形如 "2026-10-27 08:30:00"，無時區，此處當作 UTC 處理
const fixDate=d=>!d?'':(/[zZ]$|[+-]\d\d:?\d\d$/.test(d)?d:d.replace(' ','T')+'Z');
function parseJson(j,src,n){if(!j||j.status!=='ok'||!Array.isArray(j.items))return [];return j.items.slice(0,n||6).map(e=>mkItem(src,e.title,e.description||e.content,fixDate(e.pubDate),e.link)).filter(i=>i.t)}
async function getItems(u,src,n,cnt){
 try{const r=await fetch(R2J(u),{signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined});if(r.ok){const it=parseJson(await r.json(),src,n);if(it.length){if(cnt!==false)viaJson++;return it}}}catch(e){}
 const x=await getXml(u);return x?parseItems(x,src,n):[]}
// ── 自訂頻道：新增 RSS、匯出／載入本機 JSON ──
let CH=[],cs=-1,mgrMsg='',cbusy=false;
const safeU=u=>/^https?:\/\//i.test(u||'')?u:'';
const chStore=()=>{try{localStorage.setItem('lp-channels',JSON.stringify(CH.map(c=>({name:c.n,emoji:c.e,url:c.u,items:c.items.slice(0,10)}))))}catch(e){}};
function normCh(r){if(!r||typeof r!=='object')return null;const u=safeU(String(r.url||'').trim());if(!u)return null;
 const items=Array.isArray(r.items)?r.items.slice(0,10).map(i=>({t:String((i&&i.t)||'').slice(0,140),b:String((i&&i.b)||'').slice(0,280),s:String((i&&i.s)||'').slice(0,40),d:String((i&&i.d)||'').slice(0,30),u:safeU(i&&i.u)})).filter(i=>i.t):[];
 let host='自訂';try{host=new URL(u).hostname}catch(e){}
 return{n:String(r.name||host).slice(0,20),e:String(r.emoji||'📡').slice(0,4),u:u,items:items,msg:items.length?'顯示 JSON 內的快照內容':'尚未抓取'}}
function mergeCh(list){let n=0;for(const r of list){const c=normCh(r);if(!c)continue;const k=CH.findIndex(x=>x.u===c.u);if(k>=0){CH[k].n=c.n;CH[k].e=c.e;if(c.items.length)CH[k].items=c.items}else{CH.push(c);n++}}chStore();navCustom();return n}
const markNav=()=>[...nav.children].forEach((b,k)=>b.classList.toggle('on',cs===-2?k===D.length+CH.length:(cs>=0&&k===D.length+cs)));
function navCustom(){[...nav.children].slice(D.length).forEach(b=>b.remove());
 CH.forEach((c,ci)=>{const b=document.createElement('button');b.textContent=c.e+' '+c.n;b.onclick=()=>openCh(ci);nav.appendChild(b)});
 const m=document.createElement('button');m.textContent='＋ 自訂頻道';m.onclick=()=>openCh(-2);nav.appendChild(m);markNav()}
function openCh(ci){cs=ci;sel=-1;if(window._room)_room.presence({isl:-1});tgt.set(0,0,0);tR=95*fit;markNav();drawCh(false)}
function closeCh(){cs=-1;panel.classList.remove('open');[...nav.children].forEach(b=>b.classList.remove('on'))}
function head(t,sub){panel.innerHTML='';const x=document.createElement('button');x.className='close';x.textContent='✕';x.setAttribute('aria-label','關閉');x.onclick=closeCh;const h=document.createElement('h2');h.textContent=t;const p=document.createElement('p');p.textContent=sub;panel.append(x,h,p)}
function mkEl(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function drawCh(keep){if(cs===-2)return drawMgr(keep);const c=CH[cs];if(!c){closeCh();return}const st=panel.scrollTop;
 head(c.e+' '+c.n,c.u);panel.append(mkEl('div','warn',c.msg||''));
 const mb=mkEl('button','tb','管理頻道');mb.onclick=()=>openCh(-2);panel.append(mb);
 c.items.forEach((it,k)=>{const key='c:'+(it.u||c.u+'#'+k),r=mkEl('div','it'+(read[key]?' read':''));
  const chk=mkEl('button','chk',read[key]?'✓':'');chk.setAttribute('aria-label','標記已讀');chk.onclick=()=>{read[key]=!read[key];if(!read[key])delete read[key];save();drawCh(true)};
  const bx=mkEl('div'),ti=it.zh||it.t,a=mkEl('a',null,ti);a.href=safeU(it.u)||c.u;a.target='_blank';a.rel='noopener';
  const m=mkEl('div','meta',(it.s||c.n)+(it.d?'・'+it.d:''));bx.append(a,m);if(it.b)bx.append(mkEl('div','bl',it.b));
  if(!CJK.test(ti)){const tb=mkEl('button','tb','譯'),tt=mkEl('div','tr');tb.onclick=async()=>{tb.disabled=true;try{tt.textContent=await tr(ti)}catch(e){tt.textContent='此環境無法翻譯'}};m.append(tb);bx.append(tt)}
  r.append(chk,bx);panel.append(r)});
 if(!c.items.length)panel.append(mkEl('p',null,'目前沒有內容。可按「管理頻道」→「重新載入全部」，或在 JSON 的 items 提供快照。'));
 panel.classList.add('open');panel.scrollTop=keep?st:0}
function drawMgr(keep){const st=panel.scrollTop;
 head('📡 自訂頻道','貼上任何 RSS／Atom 網址即可新增（經 RSS2JSON 轉成內容）。可匯出成 JSON 存到本機，之後再載入。');
 if(mgrMsg)panel.append(mkEl('div','warn',mgrMsg));
 const nm=mkEl('input','ci'),ul=mkEl('input','ci');nm.type='text';nm.placeholder='頻道名稱（選填）';ul.type='url';ul.placeholder='RSS 網址，例如 https://example.com/feed.xml';
 const add=mkEl('button','tb','＋ 新增頻道');
 add.onclick=async()=>{const u=safeU(ul.value.trim());if(!u){mgrMsg='請輸入以 http:// 或 https:// 開頭的網址';drawMgr(true);return}
  if(CH.some(c=>c.u===u)){mgrMsg='這個網址已經新增過了';drawMgr(true);return}
  CH.push(normCh({name:nm.value.trim(),url:u}));chStore();navCustom();mgrMsg='已新增，抓取中…';drawMgr(true);await refreshCustom();mgrMsg='已新增並抓取完成';drawMgr(true)};
 panel.append(nm,ul,add);
 CH.forEach((c,ci)=>{const r=mkEl('div','it'),bx=mkEl('div'),a=mkEl('a',null,c.e+' '+c.n);a.href='#';a.onclick=e=>{e.preventDefault();openCh(ci)};
  bx.append(a,mkEl('div','meta',c.items.length+' 則・'+c.u),mkEl('div','meta',c.msg||''));
  const del=mkEl('button','chk','✕');del.setAttribute('aria-label','刪除頻道');del.onclick=()=>{CH.splice(ci,1);chStore();navCustom();mgrMsg='已刪除頻道';drawMgr(true)};
  r.append(del,bx);panel.append(r)});
 const row=mkEl('div','row');
 const rl=mkEl('button','tb','⟳ 重新載入全部');rl.onclick=async()=>{mgrMsg='抓取中…';drawMgr(true);await refreshCustom();mgrMsg='已重新載入';drawMgr(true)};
 const ex=mkEl('button','tb','💾 匯出 JSON');ex.onclick=()=>{const data={version:1,updated:new Date().toISOString(),channels:CH.map(c=>({name:c.n,emoji:c.e,url:c.u,items:c.items.slice(0,10)}))};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='channels.json';document.body.appendChild(a);a.click();a.remove();mgrMsg='已匯出 channels.json（請存放在本機）';drawMgr(true)};
 const fi=mkEl('input');fi.type='file';fi.accept='.json,application/json';fi.style.display='none';
 const im=mkEl('button','tb','📂 載入 JSON 檔');im.onclick=()=>fi.click();
 fi.onchange=async()=>{const f=fi.files&&fi.files[0];if(!f)return;try{const j=JSON.parse(await f.text()),list=Array.isArray(j)?j:j.channels;if(!Array.isArray(list))throw new Error('x');
   const n=mergeCh(list);mgrMsg='已載入 '+list.length+' 個頻道（新增 '+n+' 個），抓取中…';drawMgr(true);await refreshCustom();mgrMsg='已載入並重新抓取，共 '+CH.length+' 個頻道'}catch(e){mgrMsg='JSON 格式不正確：需為陣列，或含 channels 陣列的物件'}drawMgr(true)};
 row.append(rl,ex,im,fi);panel.append(row);
 panel.append(mkEl('p',null,'提示：瀏覽器無法直接覆寫本機檔案，所以「匯出」會下載 channels.json。把它放在本網頁同一個資料夾，用網站或本機伺服器開啟時會自動載入；直接雙擊開啟時，請用「載入 JSON 檔」。JSON 的 items 可當抓取失敗時的快照。'));
 panel.classList.add('open');panel.scrollTop=keep?st:0}
async function refreshCustom(){if(cbusy)return;cbusy=true;
 try{await Promise.all(CH.map(async c=>{const it=await getItems(c.u,/news\.google\.com/.test(c.u)?'Google 新聞':c.n,10,false);const t=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  if(it.length){c.items=it;c.msg='已更新 '+t+'（每 10 分鐘重抓）'}else c.msg=c.items.length?'抓取失敗，顯示最近一次或 JSON 內的快照':'抓取失敗，且沒有快照內容'}));chStore()}
 finally{cbusy=false}
 navCustom();if(cs>=0)drawCh(true)}
let busy=false;
async function refresh(){if(busy)return;busy=true;let ok=0;viaJson=0;refreshCustom();
 await Promise.all(FD.map(async([src,u,u2],k)=>{let it=await getItems(u,src);if(!it.length&&u2)it=await getItems(u2,'Google 新聞');if(it.length){D[k].items=it;ok++}}));
 if(ok)feedMsg='RSS 已自動更新 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'，每 10 分鐘重抓（'+ok+'/7 座島成功，其中 '+viaJson+' 座經 RSS2JSON，其餘走備援或顯示快照）';
 else{try{const j=await (await fetch('news.json',{cache:'no-store'})).json();for(const k in j.islands)if(D[k]&&j.islands[k].length){D[k].items=j.islands[k];ok++}if(ok)feedMsg='已載入 news.json（'+j.updated+'）'}catch(e){}}
 if(!ok)feedMsg='此環境無法連外抓 RSS，顯示靜態快照（日期標於每則）。下載 index.html 在一般網站或本機開啟即可自動抓取。';
 busy=false;labels();if(sel>=0)draw(sel);autoTr()}
try{const j=JSON.parse(localStorage.getItem('lp-channels')||'[]');if(Array.isArray(j))mergeCh(j)}catch(e){}
navCustom();
fetch('channels.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!j)return;const l=Array.isArray(j)?j:j.channels;if(Array.isArray(l)){mergeCh(l);refreshCustom()}}).catch(()=>{});
refresh();setInterval(refresh,600000);document.getElementById('rf').onclick=refresh;
(async()=>{try{const r=window.claude&&await claude.use('room');if(!r)return;window._room=r;r.onPeers(c=>{for(const k in peerCount)delete peerCount[k];c.peers.forEach(q=>{const n=q.presence&&q.presence.isl;if(n>=0)peerCount[n]=(peerCount[n]||0)+1});if(sel>=0)draw(sel)})}catch(e){}})();
labels();

// orbit
let th=.6,ph=1.0,rad=95,tR=95;const tgt=new THREE.Vector3();const cur=new THREE.Vector3();
let fit=1,vx=0,vy=0;const sheet=()=>matchMedia('(orientation:portrait),(max-width:640px)').matches;
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<640?1.5:2));renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;fit=Math.max(1,1.2/cam.aspect);tR=(sel>=0?26:95)*fit;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const cv=renderer.domElement;let down=null,moved=0;const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let hov=-1;
const ptrs=new Map(),pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};let pd=0;
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY};moved=0;if(ptrs.size===2)pd=pdist()});
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size>=2){const n=pdist();tR=Math.min(130*fit,Math.max(10,tR*pd/n));pd=n;moved=99;return}
 if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;moved+=Math.abs(dx)+Math.abs(dy);th-=dx*.007;ph=Math.min(1.35,Math.max(.35,ph-dy*.005));down={x:e.clientX,y:e.clientY}}
 hov=pick(e)});
cv.addEventListener('pointerup',e=>{const was=ptrs.size;ptrs.delete(e.pointerId);if(was===1&&down&&moved<6){const i=pick(e);if(i>=0)go(i)}if(!ptrs.size)down=null});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);down=null});
cv.addEventListener('wheel',e=>{e.preventDefault();tR=Math.min(130*fit,Math.max(10,tR+e.deltaY*.05))},{passive:false});
document.getElementById('zi').onclick=()=>tR=Math.max(10,tR-10);document.getElementById('zo').onclick=()=>tR=Math.min(130*fit,tR+10);
function pick(e){mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);
 const h=ray.intersectObjects(islands.map(s=>s.g),true)[0];cv.style.cursor=h?'pointer':'grab';return h?h.object.userData.i:-1}

const v=new THREE.Vector3();
function loop(t){requestAnimationFrame(loop);
 if(!down&&sel<0)th+=.0015;
 rad+=(tR-rad)*.08;cur.lerp(tgt,.08);cars.forEach(carUpdate);
 cam.position.set(cur.x+rad*Math.sin(ph)*Math.sin(th),cur.y+rad*Math.cos(ph),cur.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(cur);
 folks.forEach(f=>{f.f=(f.f+(f.moving?.14:0))%9;let fr=f.moving?Math.floor(f.f):0;f.t.offset.set(fr/9,(2-f.row)/3);
  if(f.lord){f.sp.position.y=.2+Math.sin(t*.003+f.seed)*.02;return}
  if(f.wait>0){f.wait-=.016;f.moving=false;if(f.wait<=0){f.to.copy(f.p);for(let q=0;q<10;q++){const a=Math.random()*6.28,r=Math.random()*.8,tx=f.home.x+Math.cos(a)*r,tz=f.home.y+Math.sin(a)*r;if(wkClear(f.isl,f.p.x,f.p.y,tx,tz)){f.to.set(tx,tz);break}}}}
  else{const dx=f.to.x-f.p.x,dz=f.to.y-f.p.y,l=Math.hypot(dx,dz);if(l<.05){f.wait=2+Math.random()*4}else{const nx=f.p.x+dx/l*.006,nz=f.p.y+dz/l*.006;if(wkBlocked(f.isl,nx,nz)){f.to.copy(f.p);f.wait=1;f.moving=false}else{f.moving=true;f.p.x=nx;f.p.y=nz}f.row=Math.abs(dx)>Math.abs(dz)?(dx>0?2:0):1;if(Math.abs(dx)<=Math.abs(dz))f.row=1;}}
  f.sp.position.set(f.p.x,.2,f.p.y);f.sh.position.set(f.p.x,.18,f.p.y)});
 folks.forEach(f=>{const al=sel>=0&&f.isl===sel;f.bt-=.016;
  if(!al){if(f.say){f.say=false;f.bub.style.display='none'}f.bt=f.n*.8+.5}
  else if(f.bt<=0){if(f.say){f.say=false;f.bub.style.display='none';f.bt=1+Math.random()*2.5}else{const its=D[f.isl].items;if(its.length){const it=its[(f.bi++ +f.n)%its.length];let tx=it.zh||it.t;if(tx.length>24)tx=tx.slice(0,23)+'…';f.bub.textContent=tx;f.say=true;f.bt=4.5}else f.bt=2}}
  if(f.say){const g=islands[f.isl].g;v.set(g.position.x+f.sp.position.x*K,g.position.y+f.sp.position.y*K+f.sp.scale.y*K*.85,g.position.z+f.sp.position.z*K);v.project(cam);const on=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;f.bub.style.display=on?'block':'none';if(on){f.bub.style.left=(v.x*.5+.5)*innerWidth+'px';f.bub.style.top=(-v.y*.5+.5)*innerHeight+'px'}}});
 islands.forEach((s,i)=>{const want=i===sel?.35:i===hov?.18:0;s.lift+=(want-s.lift)*.12;s.g.position.y=s.lift+Math.sin(t*.0012+i)*.03;
  (s.g.userData.spin||[]).forEach(m=>m.rotation.y+=.01);
  v.copy(s.g.userData.base);v.y=2.9*K;v.project(cam);s.el.style.left=(v.x*.5+.5)*innerWidth+'px';s.el.style.top=(-v.y*.5+.5)*innerHeight+'px';s.el.style.display=v.z<1?'':'none'});
 const sh=sheet();vx+=((sel>=0&&!sh?Math.min(190,innerWidth*.2):0)-vx)*.1;vy+=((sel>=0&&sh?innerHeight*.2:0)-vy)*.1;cam.setViewOffset(innerWidth,innerHeight,vx,vy,innerWidth,innerHeight);
 renderer.render(scene,cam)}
requestAnimationFrame(loop);
